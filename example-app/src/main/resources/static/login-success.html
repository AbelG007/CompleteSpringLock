<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Successful</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f7fb;
            color: #1f2937;
        }
        .card {
            width: min(520px, calc(100vw - 32px));
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }
        p {
            margin: 0 0 16px;
            line-height: 1.6;
            color: #4b5563;
        }
        .link {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 8px;
            background: #111827;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main class="card">
    <h1>Login successful</h1>
    <p>You are now signed in to the authorization server.</p>
    <p>This page appears only when there is no OAuth redirect waiting to continue.</p>
</main>
</body>
</html>
