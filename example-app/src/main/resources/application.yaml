spring:
  application:
    name: authorizationServer
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${AS_SERVER_PORT:9000}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
  pattern:
    console: ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

app-security:
  enabled: true
  mode: authorization-server
  key-store:
    path: auth-server.p12
    password: admin123
    alias: auth-server
  bootstrap-user:
    enabled: true
    name: Bootstrap Admin
    email: bootstrap@example.com
    mobile-number: 9999999999
    password: password123
    role: ROLE_USER
    authorities:
      - ROLE_USER
  authorization-server:
    clients:
      - client-id: demo-client
        client-secret: demo-client-secret
        client-name: Demo Client
        authentication-methods:
          - client_secret_basic
        authorization-grant-types:
          - authorization_code
          - refresh_token
        redirect-uris:
          - http://127.0.0.1:8081/login/oauth2/code/demo-client
        scopes:
          - openid
          - profile
          - email
          - read
        require-authorization-consent: false
