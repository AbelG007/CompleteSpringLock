spring:
  datasource:
    url: jdbc:h2:mem:authserver;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true

app:
  authorization-server:
    issuer: http://127.0.0.1:9000
